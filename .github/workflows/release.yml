name: Create PowerShell Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v2.1, etc.
  workflow_dispatch:  # Allow manual trigger
    inputs:
      tag_name:
        description: 'latest'
        required: true
        default: 'v1.0'

permissions:
  contents: write  # Required to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags
      
    - name: Set release tag
      id: set_tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
      
    - name: Combine PowerShell files
      run: |
        # Create the combined file with header
        echo "# WinConfig - Combined Script" > winconfig-combined.ps1
        echo "# Auto-generated from: https://github.com/${{ github.repository }}" >> winconfig-combined.ps1
        echo "# Version: ${{ steps.set_tag.outputs.tag_name }}" >> winconfig-combined.ps1
        echo "" >> winconfig-combined.ps1
        
        # Function to process and add file
        add_file() {
          local file=$1
          echo "" >> winconfig-combined.ps1
          echo "#region $file" >> winconfig-combined.ps1
          echo "# =====================================" >> winconfig-combined.ps1
          echo "# Source: $file" >> winconfig-combined.ps1
          echo "# =====================================" >> winconfig-combined.ps1
          cat "$file" >> winconfig-combined.ps1
          echo "" >> winconfig-combined.ps1
          echo "#endregion $file" >> winconfig-combined.ps1
        }
        
        # Add main files in order (adjust based on your structure)
        if [ -f "Install.ps1" ]; then
          add_file "Install.ps1"
        fi
        
        # Add all other .ps1 files (excluding the combined output)
        for file in $(find . -name "*.ps1" -not -name "winconfig-combined.ps1" | sort); do
          if [ "$file" != "./Install.ps1" ]; then
            add_file "$file"
          fi
        done
        
        # Show file size
        ls -lh winconfig-combined.ps1
    
    - name: Create or update tag (for manual trigger)
      if: github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f ${{ steps.set_tag.outputs.tag_name }}
        git push origin ${{ steps.set_tag.outputs.tag_name }} -f || true
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.set_tag.outputs.tag_name }}
        name: Release ${{ steps.set_tag.outputs.tag_name }}
        files: winconfig-combined.ps1
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ## WinConfig Combined PowerShell Script
          
          This release contains a single PowerShell file combining all scripts.
          
          ### Usage
          ```powershell
          # Download and run directly
          irm https://github.com/${{ github.repository }}/releases/download/${{ steps.set_tag.outputs.tag_name }}/winconfig-combined.ps1 | iex
          
          # Or download first
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.set_tag.outputs.tag_name }}/winconfig-combined.ps1" -OutFile "winconfig.ps1"
          .\winconfig.ps1
          ```
          
          **Note:** Run PowerShell as Administrator for full functionality.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}